short_bio: >-
  <p>
  I am a Ph.D. student studying Human–Computer Interaction at the
  Gwangju Institute of Science and Technology (GIST). I am part of the
  Human-Centered Intelligent Systems Laboratory in the Department of AI,
  advised by Prof. SeungJun Kim.
  </p>
  <p>
  My research focuses on <strong>Human–AI Interaction</strong>,
  <strong>Generative AI</strong>, and <strong>Creativity Support</strong>,
  with applications in computer graphics and virtual and augmented reality.
  </p>

